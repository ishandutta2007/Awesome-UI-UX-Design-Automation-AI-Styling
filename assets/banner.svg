<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#120e24" />
      <stop offset="100%" stop-color="#070710" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.25" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatAlt {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashStream {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes spinOrb {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatAlt 8s ease-in-out infinite;
        transform-origin: center;
      }
      .ambient-glow {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 8 6;
        animation: dashStream 25s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid-pattern)" rx="16" />

  <!-- Ambient Animated Light Orbs in Background -->
  <circle cx="180" cy="80" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow-purple)" class="ambient-glow" />
  <circle cx="1020" cy="260" r="160" fill="#ec4899" opacity="0.22" filter="url(#glow-purple)" class="ambient-glow" />
  <circle cx="600" cy="180" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow-purple)" />

  <!-- Dynamic Curved Connection Stream Lines (Deep in background) -->
  <path d="M 50 180 C 300 60, 500 300, 750 160 S 1050 80, 1150 180" fill="none" stroke="rgba(139, 92, 246, 0.28)" stroke-width="2" class="stream-line" />
  <path d="M 80 260 C 350 320, 650 40, 920 220 S 1100 280, 1160 200" fill="none" stroke="rgba(236, 72, 153, 0.22)" stroke-width="1.5" class="stream-line" />

  <!-- Right Floating UI/UX Card 1 (Design Tokens / Code) -->
  <g class="floating-card-1" transform="translate(890, 48)">
    <rect width="260" height="130" rx="14" fill="#131127" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" filter="url(#glow-card)" />
    <!-- Window controls -->
    <circle cx="22" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="50" cy="22" r="5" fill="#10b981" opacity="0.8" />
    <text x="70" y="26" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">tokens.config.json</text>
    
    <rect x="20" y="44" width="75" height="18" rx="6" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="28" y="57" fill="#c4b5fd" font-family="monospace" font-size="10">primary: #8b5cf6</text>
    
    <rect x="102" y="44" width="65" height="18" rx="6" fill="#ec4899" fill-opacity="0.2" />
    <text x="110" y="57" fill="#f472b6" font-family="monospace" font-size="10">radius: 12px</text>

    <!-- Visual pill / preview -->
    <rect x="20" y="76" width="220" height="34" rx="8" fill="url(#primary-grad)" fill-opacity="0.9" />
    <text x="72" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ Auto-Generate UI</text>
  </g>

  <!-- Right Floating UI/UX Card 2 (Component Spec / Wireframe) -->
  <g class="floating-card-2" transform="translate(930, 195)">
    <rect width="230" height="115" rx="12" fill="#0f172a" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" filter="url(#glow-card)" />
    <!-- Visual Component Wireframe -->
    <rect x="18" y="18" width="55" height="38" rx="6" fill="url(#cyan-violet)" opacity="0.8" />
    <circle cx="45" cy="37" r="10" fill="#ffffff" opacity="0.9" />
    
    <rect x="85" y="20" width="105" height="10" rx="4" fill="#38bdf8" opacity="0.7" />
    <rect x="85" y="36" width="75" height="8" rx="3" fill="#64748b" opacity="0.6" />
    <rect x="85" y="48" width="120" height="6" rx="3" fill="#475569" opacity="0.4" />

    <line x1="18" y1="72" x2="210" y2="72" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <rect x="18" y="82" width="90" height="20" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="28" y="96" fill="#38bdf8" font-family="monospace" font-size="10">Prompt-to-Code</text>
    <rect x="115" y="82" width="70" height="20" rx="5" fill="#22c55e" fill-opacity="0.2" />
    <text x="123" y="96" fill="#4ade80" font-family="monospace" font-size="10">✓ 99.4% Spec</text>
  </g>

  <!-- Left Design Flow Decorator (AI Agent Node Flow) -->
  <g class="floating-card-1" transform="translate(48, 205)">
    <rect width="180" height="95" rx="12" fill="#111827" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1.2" filter="url(#glow-card)" />
    <text x="18" y="28" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🎨 Design System</text>
    <circle cx="30" cy="55" r="14" fill="#8b5cf6" />
    <text x="25" y="60" fill="#fff" font-family="sans-serif" font-size="13">🤖</text>
    <path d="M 52 55 L 85 55" stroke="#f472b6" stroke-width="2" stroke-linecap="round" />
    <polygon points="85,51 93,55 85,59" fill="#f472b6" />
    <circle cx="115" cy="55" r="14" fill="#3b82f6" />
    <text x="110" y="60" fill="#fff" font-family="sans-serif" font-size="13">✨</text>
    <text x="18" y="82" fill="#94a3b8" font-family="monospace" font-size="9">Agent UI/UX Synthesis</text>
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Ensured 100% Foreground Isolation) -->
  <g id="hero-foreground-text" transform="translate(180, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 58)">
      <rect width="365" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="15" cy="15" r="5" fill="#22c55e" />
      <text x="28" y="19" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">NEXT-GEN FRONTEND &amp; DESIGN INTELLIGENCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      UI/UX Design Automation
    </text>
    <text x="0" y="172" fill="url(#primary-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; AI Styling Ecosystem
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="210" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Curated showcase of SaaS powerhouses and open-source generative UI tools,
    </text>
    <text x="0" y="230" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      design-to-code compilers, AI agent UI skills, and modern component architectures.
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✨ Prompt-to-UI</text>

      <rect x="122" y="0" width="128" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="134" y="17" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📐 Design-to-Code</text>

      <rect x="260" y="0" width="126" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="272" y="17" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎨 Design Systems</text>

      <rect x="396" y="0" width="122" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="408" y="17" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🤖 AI Coding Skills</text>
    </g>
  </g>
</svg>
